spring.application.name=backend
server.port=8081

# Importa o arquivo .env local automaticamente para o Spring
spring.config.import=optional:file:.env[.properties]

# Conexão com o Postgres usando as variáveis seguras
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ============================================================
# Swagger / SpringDoc OpenAPI
# ============================================================
# URL da interface grafica do Swagger UI (atalho): http://localhost:8081/swagger
# URL da pagina completa (redirecionada pelo atalho): http://localhost:8081/swagger-ui/index.html
# URL do JSON da OpenAPI spec (consumido por clientes/Postman): http://localhost:8081/v3/api-docs

# Caminho customizado do JSON da spec
springdoc.api-docs.path=/v3/api-docs

# Caminho ATALHO customizado da UI do Swagger (redireciona para /swagger-ui/index.html)
springdoc.swagger-ui.path=/swagger

# Mostra todos os endpoints, incl. os de erro do Spring
springdoc.show-actuator=false
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Habilita o Swagger UI explicitamente (pode desligar em producao depois)
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true